[project]
name = "call-followup"
version = "0.1.0"
description = "Auto-replies to Telegram and WhatsApp calls you missed or rejected, using a local LM Studio model"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    # Draws the conversation card attached to each notification. Optional at
    # runtime: app/render.py degrades to text-only notifications without it.
    "pillow>=10.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
